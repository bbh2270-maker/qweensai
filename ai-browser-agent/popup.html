<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Browser Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 13px;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }
    
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }
    
    .btn-primary:hover {
      background: #0ea5e9;
    }
    
    .btn-primary:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    
    .btn-danger {
      background: #ef4444;
      color: white;
      margin-top: 8px;
    }
    
    .btn-danger:hover {
      background: #dc2626;
    }
    
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    
    .status.running {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }
    
    .status-idle {
      color: #94a3b8;
    }
    
    .status-active {
      color: #38bdf8;
    }
    
    .history {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .history-item {
      padding: 8px;
      margin-bottom: 6px;
      background: #1e293b;
      border-radius: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    
    .history-step {
      font-weight: 600;
      color: #38bdf8;
    }
    
    .api-config {
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    
    .config-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>🤖 AI Browser Agent</h1>
  <p class="subtitle">Autonomous web browsing powered by AI</p>
  
  <div class="api-config">
    <div class="config-label">API Configuration</div>
    <div class="form-group">
      <label for="provider">AI Provider</label>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="claude">Anthropic Claude</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key">
    </div>
    
    <div class="form-group">
      <label for="model">Model</label>
      <input type="text" id="model" placeholder="e.g., gemini-2.0-flash-exp">
    </div>
  </div>
  
  <div class="form-group">
    <label for="task">Task Description</label>
    <textarea id="task" placeholder="Describe what you want the agent to do...&#10;&#10;Examples:&#10;- Search for latest AI news and summarize top 3 articles&#10;- Find the cheapest flight from NYC to London next month&#10;- Look up Python documentation for async functions"></textarea>
  </div>
  
  <button id="startBtn" class="btn-primary">Start Agent</button>
  <button id="stopBtn" class="btn-danger" style="display: none;">Stop Agent</button>
  
  <div id="status" class="status">
    <span class="status-idle">Agent is idle</span>
  </div>
  
  <div id="history" class="history"></div>
  
  <script src="popup.js"></script>
</body>
</html>
