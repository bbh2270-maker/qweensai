<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent:#ff5c00; --bg:#111418; --card:#1b2026; --text:#e8eaed; --muted:#9aa0a6; }
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { width: 380px; margin:0; background:var(--bg); color:var(--text); }
  header { padding:12px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #2a2f36; }
  header .dot { width:10px;height:10px;border-radius:50%;background:var(--accent); }
  header h1 { font-size:15px; margin:0; flex:1; }
  #statusBadge { font-size:11px; padding:2px 8px; border-radius:10px; background:#2a2f36; color:var(--muted); }
  #statusBadge.running { background:#123d1e; color:#57d977; }
  main { padding:12px 14px; }
  label { font-size:11px; color:var(--muted); display:block; margin:8px 0 3px; }
  select, input, textarea, button {
    width:100%; padding:8px; border-radius:8px; border:1px solid #2f353d;
    background:var(--card); color:var(--text); font-size:13px;
  }
  textarea { min-height:64px; resize:vertical; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  button.primary { background:var(--accent); border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:10px; }
  button.primary:hover { filter:brightness(1.1); }
  button.danger { background:#7a1f1f; border:none; color:#fff; cursor:pointer; margin-top:8px; }
  #log { margin-top:12px; max-height:220px; overflow-y:auto; font-size:11.5px; line-height:1.5; }
  .entry { padding:6px 8px; border-radius:6px; background:var(--card); margin-bottom:6px; border-left:3px solid #2f353d; }
  .entry.thought { border-left-color:#4a9eff; }
  .entry.action { border-left-color:var(--accent); }
  .entry.answer { border-left-color:#57d977; white-space:pre-wrap; }
  .entry.error { border-left-color:#ff4a4a; }
  .muted { color:var(--muted); }
  details { margin-top:6px; }
  summary { cursor:pointer; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>AI Browser Agent</h1>
  <span id="statusBadge">idle</span>
</header>
<main>
  <div class="row">
    <div>
      <label>Provider (auto: Claude &gt; Gemini &gt; Groq &gt; OpenRouter)</label>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="claude">Anthropic Claude</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
      </select>
    </div>
    <div>
      <label>Model</label>
      <input id="model" placeholder="model name">
    </div>
  </div>
  <label>API Key — <span id="keyProviderLabel">Gemini</span></label>
  <input id="apiKey" type="password" placeholder="paste your API key">

  <details>
    <summary>All provider keys (fallback chain)</summary>
    <p style="font-size:11px;opacity:.7;margin:4px 0;">Keys saved here are auto-detected. The agent always uses the best available brain: if Claude's key exists it leads, otherwise Gemini takes the main role, then Groq, then OpenRouter.</p>
    <label>Claude key</label><input id="key_claude" type="password" placeholder="sk-ant-...">
    <label>Gemini key</label><input id="key_gemini" type="password" placeholder="AIza...">
    <label>Groq key</label><input id="key_groq" type="password" placeholder="gsk_...">
    <label>OpenRouter key</label><input id="key_openrouter" type="password" placeholder="sk-or-...">
  </details>

  <label>Task</label>
  <textarea id="task" placeholder='e.g. "Search Google for the cheapest flight Dhaka to Dubai next week and tell me the price"'></textarea>

  <button class="primary" id="startBtn">▶ Start Agent</button>
  <button class="danger" id="stopBtn" style="display:none">■ Stop</button>

  <details open>
    <summary>Activity log</summary>
    <div id="log"></div>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
